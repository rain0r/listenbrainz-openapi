required:
  - 'musicbrainz_id'
  - 'latest_import'
properties:
  musicbrainz_id:
    type: string
    description: the MusicBrainz ID of the user
  latest_import:
    type: string
    description: 'the timestamp of the newest listen submitted in previous imports. Defaults to 0'
  status:
    type: object
    properties:
      state:
        type: string
        description: 'a short string denoting the state of the import'
      count:
        type: integer
        description: 'the number of listens that have been imported for the user by the importer'
  error:
    type: object
    properties:
      retry:
        type: boolean        
      message:
        type: string
        description: 'Optional error message from the import service"'  