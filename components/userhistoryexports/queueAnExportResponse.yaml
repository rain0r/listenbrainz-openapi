type: object
required:
  - export_id
  - type
  - created
  - progress
  - status
properties:
  export_id:
    type: integer
    description: Unique identifier for the data export request.
    example: 123
  type:
    type: string
    description: The kind of export being requested.
    enum:
      - delete_listens
      - delete_user
      - export_all_user_data
      - import_listens
    example: export_all_user_data
  available_until:
    type: string
    format: date-time
    nullable: true
    description: A completed export normally remains available for 30 days after completion.
    example: '2026-10-17T12:00:00+00:00'
  created:
    type: string
    format: date-time
    description: Timestamp of when the export request was created (UTC).
    example: '2026-09-17T12:00:00+00:00'
  progress:
    type: string
    description: Same as status, but human readable.
    example: 'Your data export will start soon.'
  status:
    type: string
    description: Status of the export request.
    enum:
      - in_progress
      - completed
      - failed
      - pending
      - waiting
    example: waiting
  filename:
    type: string
    nullable: true
    description: Name of the generated export file, present once the export completes.
    example: 'user_export_123.zip'
  start_time:
    type: string
    format: date-time
    nullable: true
    description: Optional inclusive start of the listen range, in UNIX seconds.
    example: '2026-09-17T12:05:00+00:00'
  end_time:
    type: string
    format: date-time
    nullable: true
    description: Optional inclusive end of the listen range, in UNIX seconds.
    example: '2026-09-17T12:12:30+00:00'
