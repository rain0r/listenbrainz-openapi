get:
  operationId: downloadExportObject
  tags:
    - lbUserhistoryexports
  summary: |-
    Download the completed archive. No JSON request body is required. Byte-range/resumable downloads are not currently supported; an interrupted download must restart using the same export ID, without generating a new job.
  parameters:
    - name: export_id
      in: path
      required: true
      schema:
        type: integer
  security:
    - ApiKeyAuth: []
  requestBody:
    required: false
  responses:
    '200':
      description: Archive returned
      content:
        application/zip:
          schema:
            type: string
            format: binary
    '401':
      description: Invalid authorization.
    '404':
      description: Export is not completed, is missing, belongs to another account, or its archive is no longer available.
